[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent-framework"
version = "0.1.0"
description = "CLI-first Python agent harness for Nexus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.57.0",
  "click>=8.1",
  "google-genai>=2.2.0",
  "rich>=14.0.0",
  "textual>=8.2.4",
  "httpx>=0.27",
  "pyyaml>=6.0.2",
  "pyfiglet>=1.0.4",
  "sentry-sdk>=2.60.0",
]

[project.scripts]
nexus = "nexus.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["nexus"]
